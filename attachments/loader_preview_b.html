<style>
  /* ===== 以下 #loader 部分是给 Grok 照搬的样式 ===== */
  html, body { margin: 0; height: 100%; background: #0E1314; }
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 70% 60% at 50% 50%, #1A2325 0%, #131A1B 55%, #0C1112 100%);
    transition: opacity 1.2s ease;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    -webkit-user-select: none; user-select: none;
  }
  #loader.hide { opacity: 0; pointer-events: none; }

  .bi { position: relative; width: 120px; height: 120px; }
  .bi svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* 进度弧：JS 改 stroke-dashoffset */
  .bi .progress { transition: stroke-dashoffset .25s linear; }

  /* 环绕的短弧：放在独立 div 上用 CSS transform 旋转，主线程卡住时也会继续转 */
  .orbit { position: absolute; inset: 0; will-change: transform; animation: spin 2.6s linear infinite; }
  .orbit.slow { animation-duration: 7s; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader.done .orbit { opacity: 0; transition: opacity .6s; }

  /* 飘落的槐叶（晚秋），只用 transform/opacity 动画 */
  .bi svg.leaf { position: absolute; inset: auto; left: 50%; top: 50%; width: 9px; height: 5px; will-change: transform, opacity;
          animation: drift 11s ease-in-out infinite; opacity: 0; }
  .leaf.b { animation-delay: 5.5s; animation-duration: 13s; }
  @keyframes drift {
    0%   { transform: translate(-70px, -110px) rotate(10deg);  opacity: 0; }
    12%  { opacity: .75; }
    35%  { transform: translate(-40px, -60px) rotate(70deg); }
    60%  { transform: translate(-75px, -5px)  rotate(140deg); }
    85%  { opacity: .6; }
    100% { transform: translate(-45px, 70px)  rotate(220deg); opacity: 0; }
  }

  .title { margin-top: 30px; font-size: 15px; letter-spacing: .55em; text-indent: .55em; color: rgba(232,223,204,.72); }
  .pct { margin-top: 12px; height: 18px; font-size: 11px; letter-spacing: .12em; color: rgba(232,223,204,.42);
         font-variant-numeric: tabular-nums; transition: opacity .5s; }
  .enter { margin-top: 22px; padding: 6px 18px; font: inherit; font-size: 14px; letter-spacing: .6em; text-indent: .6em;
           color: #E8D7B4; background: none; border: 1px solid rgba(232,215,180,.28); border-radius: 2px; cursor: pointer;
           opacity: 0; pointer-events: none; transition: opacity .8s, border-color .3s, color .3s; position: absolute; top: calc(50% + 80px); }
  .enter:hover, .enter:focus-visible { border-color: rgba(232,215,180,.7); color: #FFF2D6; outline: none; }
  #loader.done .pct { opacity: 0; }
  #loader.done .enter { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .orbit, .leaf { animation: none; } }
  /* ===== #loader 样式结束 ===== */

  /* 预览专用：假场景 + 控制条 */
  #scene { position: fixed; inset: 0; background: linear-gradient(#5B5568 0%, #B98A6A 46%, #3A3430 47%, #2F2A24 100%); }
  #scene p { position: absolute; bottom: 40%; width: 100%; text-align: center; color: #E8DFCC; font: 14px/1.6 serif; opacity: .8; }
  #ctl { position: fixed; left: 12px; bottom: 12px; z-index: 10000; display: flex; gap: 8px; }
  #ctl button { font: 12px sans-serif; color: #ccc; background: #222a2c; border: 1px solid #3a4446; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  #log { position: fixed; right: 12px; bottom: 12px; z-index: 10000; font: 11px monospace; color: #7f8a8c; }
</style>

<script>
// ---- loader 接口（给 Grok 参考：只需调用 setProgress(0..1) 和 ready()）----
const L = document.getElementById('loader');
const arc = L.querySelector('.progress');
const pct = L.querySelector('.pct');
const btn = L.querySelector('.enter');
const C = 345.6;
let target = 0, shown = 0, stageCap = 0.8, isReady = false;
function setProgress(p, cap) { target = Math.max(target, Math.min(1, p)); if (cap) stageCap = cap; }
function ready() { target = 1; isReady = true; }
function tick() {
  // 平滑追赶，只增不减；真实值停住时慢爬，不超过当前阶段上限的 98%
  if (shown < target) shown += (target - shown) * 0.08 + 0.0005;
  else if (!isReady && shown < stageCap * 0.98) shown += 0.0003;
  shown = Math.min(shown, isReady ? 1 : stageCap * 0.98, 1);
  arc.style.strokeDashoffset = (C * (1 - shown)).toFixed(2);
  const n = Math.floor(shown * 100);
  pct.textContent = n;
  L.setAttribute('aria-valuenow', n);
  if (isReady && shown > 0.995) { L.classList.add('done'); btn.focus({ preventScroll: true }); return; }
  requestAnimationFrame(tick);
}
function enter() {
  L.classList.add('hide');
  L.addEventListener('transitionend', e => { if (e.target === L) L.style.display = 'none'; }, { once: true });
}
btn.addEventListener('click', enter);

// ---- 以下仅用于预览：模拟下载 / 建场景 / 预热 ----
const log = document.getElementById('log');
function busy(ms) { const t = performance.now(); while (performance.now() - t < ms) {} }
async function simulate() {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  log.textContent = '下载中';
  for (let i = 1; i <= 20; i++) { await wait(80 + Math.random() * 160); if (i === 9) await wait(1400); setProgress(0.8 * i / 20, 0.8); }
  log.textContent = '建场景'; setProgress(0.8, 0.9);
  for (let i = 1; i <= 5; i++) { await wait(200); setProgress(0.8 + 0.1 * i / 5, 0.9); }
  log.textContent = '预热（主线程卡 1.5 秒，短弧应照常转）'; setProgress(0.9, 1);
  await wait(300); busy(1500); setProgress(0.97, 1); await wait(400);
  log.textContent = '完成'; ready();
}
function start() {
  target = shown = 0; stageCap = 0.8; isReady = false;
  L.className = ''; L.style.display = ''; tick(); simulate();
}
document.getElementById('replay').onclick = start;
document.getElementById('block').onclick = () => busy(1500);
start();
</script>
