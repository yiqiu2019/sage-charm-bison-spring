<script type="module">
import * as THREE from "https://unpkg.com/three@0.170.0/build/three.module.js";

const WAY = [
  [168, -34], [158, -36], [148, -40], [128, -40], [108, -40], [98, -36],
  [70, -28], [20, -28], [-28, -28], [-28, 40], [-28, 120], [-28, 220],
  [-28, 248], [62, 248], [62, 300], [62, 408], [180, 408], [280, 408],
  [378, 408], [378, 300], [378, 180], [378, 80], [378, -28], [280, -28],
  [220, -28], [190, -28], [175, -32],
];

const CONTOUR = [
  [0, 0], [350, 0], [350, 380], [90, 380], [90, 220], [0, 220],
];

const OUTER_WATER = [
  [-44, -44], [98, -44], [98, -59], [158, -59], [158, -44], [394, -44],
  [394, 424], [46, 424], [46, 264], [-44, 264],
];
const INNER_WATER = [
  [-12, -12], [98, -12], [98, -16], [158, -16], [158, -12], [362, -12],
  [362, 392], [78, 392], [78, 232], [-12, 232],
];

const SUN_DIR = new THREE.Vector3(-0.913, 0.174, -0.369);
const MAX_SPEED = 4.5;
const DAMP = 3.2;
const ACCEL = DAMP * MAX_SPEED;
const MAX_YAW_RATE = 0.9;
const DEG = Math.PI / 180;

const params = new URLSearchParams(location.search);
const topView = params.has("top");

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function hypot2(x, z) { return Math.hypot(x, z); }

function detectPhone() {
  const ua = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const coarse = window.matchMedia("(pointer: coarse)").matches;
  const shortSide = Math.min(window.innerWidth, window.innerHeight);
  return ua || (coarse && shortSide < 900);
}

function pointInPoly(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], zi = poly[i][1];
    const xj = poly[j][0], zj = poly[j][1];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}

function intersectLine(l1, l2) {
  const det = l1.dx * l2.dz - l1.dz * l2.dx;
  if (Math.abs(det) < 1e-9) return [l1.px, l1.pz];
  const t = ((l2.px - l1.px) * l2.dz - (l2.pz - l1.pz) * l2.dx) / det;
  return [l1.px + l1.dx * t, l1.pz + l1.dz * t];
}

function offsetPoly(pts, distAtEdge) {
  const n = pts.length;
  const lines = [];
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const dx = b[0] - a[0], dz = b[1] - a[1];
    const len = Math.hypot(dx, dz) || 1;
    const lx = -dz / len, lz = dx / len;
    const d = typeof distAtEdge === "function" ? distAtEdge(i, a, b) : distAtEdge;
    lines.push({ px: a[0] + lx * d, pz: a[1] + lz * d, dx, dz });
  }
  const out = [];
  for (let i = 0; i < n; i++) out.push(intersectLine(lines[(i - 1 + n) % n], lines[i]));
  return out;
}

function filletClosed(pts, radiusAt) {
  const n = pts.length;
  const data = pts.map((p, i) => {
    const prev = pts[(i - 1 + n) % n];
    const next = pts[(i + 1) % n];
    const inX = p[0] - prev[0], inZ = p[1] - prev[1];
    const outX = next[0] - p[0], outZ = next[1] - p[1];
    const inL = Math.hypot(inX, inZ) || 1, outL = Math.hypot(outX, outZ) || 1;
    const ix = inX / inL, iz = inZ / inL, ox = outX / outL, oz = outZ / outL;
    const cross = ix * oz - iz * ox;
    const dot = clamp(ix * ox + iz * oz, -1, 1);
    return { ix, iz, ox, oz, outL, signed: Math.atan2(cross, dot) };
  });
  const wantR = data.map((d, i) => {
    const r = radiusAt(pts[i], d.signed, i) || 0;
    return r > 0 && Math.abs(d.signed) > 0.02 ? r : 0;
  });
  const L = wantR.map((r, i) => (r ? r * Math.tan(Math.abs(data[i].signed) / 2) : 0));
  const usedR = wantR.slice();
  for (let iter = 0; iter < 6; iter++) {
    for (let i = 0; i < n; i++) {
      const need = L[i] + L[(i + 1) % n];
      const edgeLen = data[i].outL;
      if (need > edgeLen * 0.96 && need > 1e-8) {
        const scale = (edgeLen * 0.96) / need;
        L[i] *= scale; L[(i + 1) % n] *= scale;
        usedR[i] *= scale; usedR[(i + 1) % n] *= scale;
      }
    }
  }
  const out = [];
  const notes = [];
  for (let i = 0; i < n; i++) {
    if (wantR[i] > 0 && usedR[i] < wantR[i] - 0.05) {
      notes.push({ i, want: +wantR[i].toFixed(2), used: +usedR[i].toFixed(2), at: pts[i] });
    }
    const p = pts[i], d = data[i];
    if (L[i] < 0.04) { out.push([p[0], p[1]]); continue; }
    const r = L[i] / Math.tan(Math.abs(d.signed) / 2);
    const t0x = p[0] - d.ix * L[i], t0z = p[1] - d.iz * L[i];
    const t1x = p[0] + d.ox * L[i], t1z = p[1] + d.oz * L[i];
    const side = d.signed > 0 ? 1 : -1;
    const cx = t0x + side * (-d.iz) * r;
    const cz = t0z + side * d.ix * r;
    const a0 = Math.atan2(t0z - cz, t0x - cx);
    const a1 = Math.atan2(t1z - cz, t1x - cx);
    let delta = a1 - a0;
    while (delta > Math.PI) delta -= Math.PI * 2;
    while (delta < -Math.PI) delta += Math.PI * 2;
    if (d.signed > 0 && delta < 0) delta += Math.PI * 2;
    if (d.signed < 0 && delta > 0) delta -= Math.PI * 2;
    const steps = Math.max(2, Math.ceil(Math.abs(delta) / (8 * DEG)));
    for (let k = 0; k <= steps; k++) {
      const ang = a0 + delta * (k / steps);
      out.push([cx + Math.cos(ang) * r, cz + Math.sin(ang) * r]);
    }
  }
  return { pts: dedupe(out), notes };
}

function dedupe(pts) {
  const o = [];
  for (const p of pts) {
    if (!o.length || hypot2(p[0] - o[o.length - 1][0], p[1] - o[o.length - 1][1]) > 0.03) o.push(p);
  }
  if (o.length > 1 && hypot2(o[0][0] - o[o.length - 1][0], o[0][1] - o[o.length - 1][1]) < 0.03) o.pop();
  return o;
}

function nearPoint(p, list, r) {
  return list.some((t) => hypot2(p[0] - t[0], p[1] - t[1]) < r);
}

const route = filletClosed(WAY, (_p, signed) => (signed < -0.04 ? 12 : 0));
const routePts = route.pts;
const segs = [];
let routeLen = 0;
for (let i = 0; i < routePts.length; i++) {
  const a = routePts[i], b = routePts[(i + 1) % routePts.length];
  const dx = b[0] - a[0], dz = b[1] - a[1];
  const len = Math.hypot(dx, dz);
  if (len < 1e-4) continue;
  segs.push({ ax: a[0], az: a[1], dx, dz, len, s0: routeLen });
  routeLen += len;
}

function project(x, z, hint) {
  let best = null;
  for (let i = 0; i < segs.length; i++) {
    const sg = segs[i];
    let t = ((x - sg.ax) * sg.dx + (z - sg.az) * sg.dz) / (sg.len * sg.len);
    t = clamp(t, 0, 1);
    const px = sg.ax + sg.dx * t, pz = sg.az + sg.dz * t;
    const d = hypot2(x - px, z - pz);
    let hintPen = 0;
    if (hint != null) {
      let di = Math.abs(i - hint);
      di = Math.min(di, segs.length - di);
      if (di > 4) hintPen = 0.35;
    }
    const score = d + hintPen;
    if (!best || score < best.score - 1e-6 || (Math.abs(score - best.score) < 0.25 && hint != null && hintPen < best.hintPen)) {
      best = { x: px, z: pz, d, s: sg.s0 + sg.len * t, i, dx: sg.dx, dz: sg.dz, len: sg.len, score, hintPen };
    }
  }
  return best;
}

const wpS = WAY.map((p) => project(p[0], p[1], null).s);
function forwardSpan(s, a, b) {
  const u = (s - a + routeLen) % routeLen;
  const ub = (b - a + routeLen) % routeLen;
  return { u, ub, on: u <= ub + 1e-3 };
}
function halfWidth(s) {
  const span = forwardSpan(s, wpS[0], wpS[1]);
  if (span.on) return 10 + (6 - 10) * (span.ub < 1e-4 ? 1 : span.u / span.ub);
  if (forwardSpan(s, wpS[1], wpS[5]).on) return 6;
  return 10;
}
function inBSegment(s) { return forwardSpan(s, wpS[1], wpS[5]).on; }

const outerB = [[98, -44], [98, -59], [158, -59], [158, -44]];
const innerB = [[98, -12], [98, -16], [158, -16], [158, -12]];
const outerFillet = filletClosed(OUTER_WATER, (p) => (nearPoint(p, outerB, 0.3) ? 6 : 0));
const innerFillet = filletClosed(INNER_WATER, (p) => (nearPoint(p, innerB, 0.3) ? 2 : 0));
const outerPoly = outerFillet.pts;
const innerPoly = innerFillet.pts;

function isBFront(a, b) {
  const mx = (a[0] + b[0]) / 2, mz = (a[1] + b[1]) / 2;
  const dx = Math.abs(b[0] - a[0]), dz = Math.abs(b[1] - a[1]);
  return mz < -15.3 && mz > -16.8 && mx > 99.5 && mx < 156.5 && dx > dz;
}
function innerBankDist(_i, a, b) { return isBFront(a, b) ? 5 : 3; }

function waveY(x, z, t) {
  return Math.sin(x * 0.16 + t * 0.9) * 0.018
    + Math.sin(z * 0.13 - t * 0.7 + 1.7) * 0.015
    + Math.sin((x + z) * 0.09 + t * 0.5) * 0.012;
}
function inWater(x, z) {
  return pointInPoly(x, z, outerPoly) && !pointInPoly(x, z, innerPoly);
}

class Buf {
  constructor() { this.pos = []; this.nrm = []; }
  tri(a, b, c, n) {
    this.pos.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
    this.nrm.push(n[0], n[1], n[2], n[0], n[1], n[2], n[0], n[1], n[2]);
  }
  quad(p0, p1, p2, p3, hint) {
    const ax = p1[0] - p0[0], ay = p1[1] - p0[1], az = p1[2] - p0[2];
    const bx = p3[0] - p0[0], by = p3[1] - p0[1], bz = p3[2] - p0[2];
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const len = Math.hypot(nx, ny, nz) || 1;
    nx /= len; ny /= len; nz /= len;
    const flip = hint && nx * hint[0] + ny * hint[1] + nz * hint[2] < 0;
    if (flip) { nx = -nx; ny = -ny; nz = -nz; }
    const n = [nx, ny, nz];
    if (flip) { this.tri(p0, p3, p2, n); this.tri(p0, p2, p1, n); }
    else { this.tri(p0, p1, p2, n); this.tri(p0, p2, p3, n); }
  }
  box(cx, cy, cz, sx, sy, sz) {
    this.orientedBox(cx, cy, cz, sx, sy, sz, 0);
  }
  orientedBox(cx, cy, cz, sx, sy, sz, yaw) {
    const c = Math.cos(yaw), s = Math.sin(yaw);
    const R = (x, y, z) => [cx + x * c + z * s, cy + y, cz - x * s + z * c];
    const x = sx / 2, y = sy / 2, z = sz / 2;
    const p = [
      R(-x, -y, -z), R(x, -y, -z), R(x, -y, z), R(-x, -y, z),
      R(-x, y, -z), R(x, y, -z), R(x, y, z), R(-x, y, z),
    ];
    this.quad(p[7], p[6], p[5], p[4], [0, 1, 0]);
    this.quad(p[0], p[1], p[2], p[3], [0, -1, 0]);
    this.quad(p[1], p[5], p[6], p[2], [1, 0, 0]);
    this.quad(p[3], p[7], p[4], p[0], [-1, 0, 0]);
    this.quad(p[4], p[5], p[1], p[0], [0, 0, -1]);
    this.quad(p[3], p[2], p[6], p[7], [0, 0, 1]);
  }
  mesh(material) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(this.nrm, 3));
    const m = new THREE.Mesh(g, material);
    m.castShadow = SHADOW;
    m.receiveShadow = SHADOW;
    return m;
  }
}

function bandsBetween(y0, y1) {
  const bands = [];
  let y = y0;
  while (y < y1 - 1e-4) {
    let boundary = Math.ceil((y + 1e-6) / 0.5) * 0.5;
    if (boundary <= y + 1e-4) boundary += 0.5;
    const yEnd = Math.min(y1, boundary);
    const onSeam = Math.abs(y / 0.5 - Math.round(y / 0.5)) < 1e-3;
    if (onSeam) {
      const yd = Math.min(yEnd, y + 0.065);
      bands.push([y, yd, true]);
      if (yd < yEnd - 1e-4) bands.push([yd, yEnd, false]);
    } else bands.push([y, yEnd, false]);
    y = yEnd;
  }
  return bands;
}

const isPhone = detectPhone();
const SHADOW = !isPhone && !topView;
document.documentElement.classList.toggle("phone", isPhone);
const help = document.getElementById("help");
if (isPhone) help.textContent = "左下摇杆划船，右半屏滑动转视角";

const renderer = new THREE.WebGLRenderer({ antialias: !isPhone, powerPreference: "high-performance" });
renderer.setPixelRatio(isPhone ? Math.min(1.25, window.devicePixelRatio || 1) : Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.84;
renderer.shadowMap.enabled = SHADOW;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0xb08962, 1);
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const scene = new THREE.Scene();
if (!topView) scene.fog = new THREE.Fog(0xb08962, 55, 260);

const rammed = new THREE.MeshStandardMaterial({ color: 0x9c7b55, roughness: 0.94, metalness: 0 });
const rammedDark = new THREE.MeshStandardMaterial({ color: 0x7e6244, roughness: 0.94, metalness: 0 });
const tileMat = new THREE.MeshStandardMaterial({
  color: 0x5e6468, roughness: 0.62, metalness: 0.04,
  polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
});
const roofMat = new THREE.MeshStandardMaterial({ color: 0x5e6468, roughness: 0.6, metalness: 0.04, side: THREE.DoubleSide });
const woodCol = new THREE.MeshStandardMaterial({ color: 0x4a3226, roughness: 0.74, metalness: 0 });
const lacquer = new THREE.MeshStandardMaterial({ color: 0x6e2e22, roughness: 0.68, metalness: 0 });
const doorMat = new THREE.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.8, metalness: 0 });
const sealMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const woodMat = new THREE.MeshStandardMaterial({ color: 0x5a4330, roughness: 0.84, metalness: 0 });
const boatMat = new THREE.MeshStandardMaterial({ color: 0x4a3628, roughness: 0.76, metalness: 0 });
const groundMat = new THREE.MeshStandardMaterial({ color: 0x6f6243, roughness: 0.97, metalness: 0, side: THREE.DoubleSide });
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x2f2a24, metalness: 0.12, roughness: 0.58, transparent: true, opacity: 0.92, depthWrite: false,
});

const baseBuf = new Buf();
const darkBuf = new Buf();
const tileBuf = new Buf();
const colBuf = new Buf();
const beamBuf = new Buf();
const redBuf = new Buf();
const doorBuf = new Buf();
const occluders = [];

function pushRammedBox(cx, cy, cz, sx, sy, sz) {
  const y0 = cy - sy / 2, y1 = cy + sy / 2;
  for (const [a, b, dark] of bandsBetween(y0, y1)) {
    (dark ? darkBuf : baseBuf).box(cx, (a + b) / 2, cz, sx, b - a, sz);
  }
}

function wallInsets(y) {
  const t = clamp((y - 0.8) / 10, 0, 1);
  return { outer: 2.25 * t, inner: 9 - 2.25 * t };
}
function lerp2(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

const ySet = new Set([0.8, 10.8]);
for (const band of bandsBetween(0.8, 10.8)) { ySet.add(band[0]); ySet.add(band[1]); }
const insetCache = new Map();
for (const y of ySet) {
  const ins = wallInsets(y);
  insetCache.set(y, {
    o: offsetPoly(CONTOUR, ins.outer),
    i: offsetPoly(CONTOUR, ins.inner),
  });
}

function edgePoint(poly, i, t) {
  const a = poly[i], b = poly[(i + 1) % poly.length];
  return lerp2(a, b, t);
}
function addWallPiece(edge, t0, t1, capStart, capEnd) {
  const a = CONTOUR[edge], b = CONTOUR[(edge + 1) % CONTOUR.length];
  const dx = b[0] - a[0], dz = b[1] - a[1];
  const len = Math.hypot(dx, dz) || 1;
  const inward = [-dz / len, dx / len];
  const hintOut = [-inward[0], 0.45, -inward[1]];
  const hintIn = [inward[0], 0.45, inward[1]];
  const sample = (which, y, t) => {
    const poly = insetCache.get(y)[which];
    const p = edgePoint(poly, edge, t);
    return p;
  };
  for (const [yA, yB, dark] of bandsBetween(0.8, 10.8)) {
    const buf = dark ? darkBuf : baseBuf;
    const oA0 = sample("o", yA, t0), oA1 = sample("o", yA, t1);
    const oB0 = sample("o", yB, t0), oB1 = sample("o", yB, t1);
    const iA0 = sample("i", yA, t0), iA1 = sample("i", yA, t1);
    const iB0 = sample("i", yB, t0), iB1 = sample("i", yB, t1);
    const P = (xz, y) => [xz[0], y, xz[1]];
    buf.quad(P(oA0, yA), P(oA1, yA), P(oB1, yB), P(oB0, yB), hintOut);
    buf.quad(P(iA1, yA), P(iA0, yA), P(iB0, yB), P(iB1, yB), hintIn);
    if (capStart) {
      const dir = t0 < 0.5 ? [-dx / len, 0, -dz / len] : [dx / len, 0, dz / len];
      buf.quad(P(oA0, yA), P(oB0, yB), P(iB0, yB), P(iA0, yA), dir);
    }
    if (capEnd) {
      const dir = [dx / len, 0, dz / len];
      buf.quad(P(oA1, yA), P(iA1, yA), P(iB1, yB), P(oB1, yB), dir);

function addCenteredWall(ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;

let audioCtx = null, audioGain = null;
function startAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume();
    return;
  }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audioCtx = new Ctx();
  const rate = audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, rate * 2, rate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for (let i = 0; i < data.length; i++) {
    const white = Math.random() * 2 - 1;
    last = (last + 0.02 * white) / 1.02;
    data[i] = last * 3.2;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 160;
  audioGain = audioCtx.createGain();
  audioGain.gain.value = 0;
  src.connect(filter);
  filter.connect(audioGain);
  audioGain.connect(audioCtx.destination);
  src.start();
}

function step(dt) {

  const reverse = speed >= 0 ? 1 : -1;
  yaw += steer * MAX_YAW_RATE * reverse * dt;

  const proj = project(boatX, boatZ, segHint);

  const half = halfWidth(proj.s);
  if (proj.d > half && proj.d > 1e-5) {
    const push = (proj.d - half) * (1 - Math.exp(-10 * dt));
    boatX -= ((boatX - proj.x) / proj.d) * push;
    boatZ -= ((boatZ - proj.z) / proj.d) * push;
  }
  if (boatX >= 98 && boatX <= 158 && boatZ > -1 && boatZ < 12) {
    boatZ += (-1 - boatZ) * (1 - Math.exp(-8 * dt));
  }
  boatY = 0.2 + waveY(boatX, boatZ, time);

}

function updateCamera(proj) {
  if (topView) return;
  const bOn = inBSegment(proj.s);
  const target = bOn ? 1 : 0;
  const stepBlend = dtHold > 0 ? dtHold / 0.6 : 0;
  if (blend < target) blend = Math.min(target, blend + stepBlend);
  else blend = Math.max(target, blend - stepBlend);
  const s = blend * blend * (3 - 2 * blend);
  gateEl.classList.toggle("on", bOn);
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  lookA.set(boatX + fx * 4, 2.4, boatZ + fz * 4);
  const bx = Math.sin(yaw), bz = Math.cos(yaw);
  const c = Math.cos(yawOff), sn = Math.sin(yawOff);
  const rx = bx * c + bz * sn;
  const rz = -bx * sn + bz * c;
  const camY = Math.max(3, lookA.y - Math.tan(pitch) * 24);
  camA.set(lookA.x + rx * 24, camY, lookA.z + rz * 24);
  camB.set(boatX + 10, boatY + 11.5, boatZ - 18);
  camPos.lerpVectors(camA, camB, s);
  lookPos.lerpVectors(lookA, lookB, s);
  const origin = new THREE.Vector3(boatX, Math.max(1.6, boatY + 1.3), boatZ);
  const delta = camPos.clone().sub(origin);
  const dist = delta.length();
  if (dist > 8.2) {
    const dir = delta.multiplyScalar(1 / dist);
    raycaster.set(origin, dir);
    raycaster.far = dist;
    const hits = raycaster.intersectObjects(occluders, false);
    if (hits.length && hits[0].distance < dist - 0.15) {
      const nd = Math.max(8, hits[0].distance - 0.4);
      camPos.copy(origin).addScaledVector(dir, nd);
    }
  }
  if (camPos.y < 3) camPos.y = 3;
  camera.position.copy(camPos);
  camera.lookAt(lookPos);
}

let dtHold = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  dtHold = dt;
  time += dt;
  const proj = step(dt);
  boat.position.set(boatX, boatY, boatZ);
  boat.rotation.set(0, yaw, 0);
  const arr = waterGeo.attributes.position.array;
  for (let i = 0; i < arr.length; i += 3) arr[i + 1] = waveY(arr[i], arr[i + 2], time);
  waterGeo.attributes.position.needsUpdate = true;
  if (audioGain && audioCtx) {
    const vol = 0.006 + 0.11 * Math.min(1, Math.abs(speed) / MAX_SPEED);
    audioGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.08);
  }
  sun.position.copy(boat.position).addScaledVector(SUN_DIR, 180);
  sun.target.position.copy(boat.position);
  updateCamera(proj);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

document.getElementById("boot").remove();
requestAnimationFrame(frame);

function auditLock() {
  const bad = [];
  let outside = 0;
  for (const sg of segs) {
    const steps = Math.max(1, Math.ceil(sg.len / 4));
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const x = sg.ax + sg.dx * t, z = sg.az + sg.dz * t;
      const s = sg.s0 + sg.len * t;
      const half = halfWidth(s);
      const nx = -sg.dz / sg.len, nz = sg.dx / sg.len;
      for (const side of [-1, 1]) {
        const px = x + nx * half * side, pz = z + nz * half * side;
        if (!inWater(px, pz)) {
          outside++;
          if (bad.length < 8) bad.push({ px: +px.toFixed(2), pz: +pz.toFixed(2), s: +s.toFixed(1), half, side });
        }
      }
      if (!inWater(x, z)) {
        outside++;
        if (bad.length < 8) bad.push({ px: +x.toFixed(2), pz: +z.toFixed(2), s: +s.toFixed(1), half, side: 0, center: true });
      }
    }
  }
  return { outside, bad, routeLen, filletNotes: route.notes, outerNotes: outerFillet.notes, innerNotes: innerFillet.notes };
}

function pointAtS(s) {
  s = ((s % routeLen) + routeLen) % routeLen;
  for (let i = 0; i < segs.length; i++) {
    const sg = segs[i];
    if (s <= sg.s0 + sg.len + 1e-4 || i === segs.length - 1) {
      const t = clamp((s - sg.s0) / sg.len, 0, 1);
      return { x: sg.ax + sg.dx * t, z: sg.az + sg.dz * t };
    }
  }
  return { x: segs[0].ax, z: segs[0].az };
}

window.__cam = () => ({
  px: +camera.position.x.toFixed(2),
  py: +camera.position.y.toFixed(2),
  pz: +camera.position.z.toFixed(2),
  lx: +lookPos.x.toFixed(2),
  ly: +lookPos.y.toFixed(2),
  lz: +lookPos.z.toFixed(2),
  blend: +blend.toFixed(2),
  fov: camera.fov,
});
window.__controlsTest = {
  getYaw: () => yaw,
  getSpeed: () => speed,
  setKeys(codes) {
    qaOverride = true;
    qaKeys.clear();
    for (const code of codes) qaKeys.add(code);
  },
  setSteer() {},
};
window.__debug = {
  pose(x, z, nextYaw) {
    boatX = x; boatZ = z; speed = 0;
    if (nextYaw != null) yaw = nextYaw;
    segHint = project(x, z, null).i;
  },
  setBlend(v) { blend = v; },
  state() {
    const p = project(boatX, boatZ, segHint);
    return { x: +boatX.toFixed(2), z: +boatZ.toFixed(2), yaw: +yaw.toFixed(3), speed: +speed.toFixed(2), s: +p.s.toFixed(1), d: +p.d.toFixed(2), half: halfWidth(p.s), inB: inBSegment(p.s), inWater: inWater(boatX, boatZ), tx: +(p.dx / p.len).toFixed(3), tz: +(p.dz / p.len).toFixed(3) };
  },
  simulate(maxSeconds = 480) {
    const saved = { boatX, boatZ, yaw, speed, segHint, time };
    boatX = 168; boatZ = -34; yaw = Math.PI / 2; speed = 0; segHint = null; time = 0;
    let traveled = 0;
    let prevS = project(boatX, boatZ, null).s;
    let outside = 0, lockBreak = 0, stuckAt = null, done = false, maxD = 0;
    const dt = 1 / 60;
    qaOverride = true;
    qaKeys.clear();
    qaKeys.add("KeyW");
    for (let t = 0; t < maxSeconds && !done; t += dt) {
      const before = project(boatX, boatZ, segHint);
      const aim = pointAtS(before.s + 14);
      let ax = aim.x - boatX, az = aim.z - boatZ;
      const al = Math.hypot(ax, az) || 1;
      ax /= al; az /= al;
      const target = Math.atan2(-ax, -az);
      const diff = Math.atan2(Math.sin(target - yaw), Math.cos(target - yaw));
      yaw += clamp(diff, -MAX_YAW_RATE * dt, MAX_YAW_RATE * dt);
      step(dt);
      time += dt;
      const after = project(boatX, boatZ, segHint);
      let ds = after.s - prevS;
      if (ds < -routeLen / 2) ds += routeLen;
      if (ds > routeLen / 2) ds -= routeLen;
      traveled += Math.max(0, ds);
      prevS = after.s;
      maxD = Math.max(maxD, after.d);
      if (!inWater(boatX, boatZ)) outside++;
      if (after.d > halfWidth(after.s) + 0.85) lockBreak++;
      if (!stuckAt && t > 20 && traveled < 12) {
        stuckAt = { t: +t.toFixed(2), x: +boatX.toFixed(1), z: +boatZ.toFixed(1), traveled: +traveled.toFixed(1), yaw: +yaw.toFixed(3), d: +after.d.toFixed(2) };
        break;
      }
      if (traveled > routeLen * 0.985) done = true;
    }
    const report = {
      done, traveled: +traveled.toFixed(1), routeLen: +routeLen.toFixed(1),
      outside, lockBreak, maxD: +maxD.toFixed(2), stuckAt,
      x: +boatX.toFixed(1), z: +boatZ.toFixed(1),
    };
    boatX = saved.boatX; boatZ = saved.boatZ; yaw = saved.yaw; speed = saved.speed; segHint = saved.segHint; time = saved.time;
    qaOverride = false;
    qaKeys.clear();
    return report;
  },
};
window.__audit = auditLock;
</script>
