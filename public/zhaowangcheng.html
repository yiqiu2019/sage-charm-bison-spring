function startAudio() {
  if (audioCtx) {

    return;
  }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audioCtx = new Ctx();
  const rate = audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, rate * 2, rate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for (let i = 0; i < data.length; i++) {
    const white = Math.random() * 2 - 1;
    last = (last + 0.02 * white) / 1.02;
    data[i] = last * 3.2;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 160;
  audioGain = audioCtx.createGain();
  audioGain.gain.value = 0;
  src.connect(filter);
  filter.connect(audioGain);
  audioGain.connect(audioCtx.destination);
  src.start();

  state() {

      const al = Math.hypot(ax, az) || 1;

window.__audit = auditLock;
window.__shore = () => {

};
window.__bigMeshes = () => {
  const rows = [];
  scene.traverse((o) => {
    if (!o.geometry) return;
    o.geometry.computeBoundingSphere();
    const r = o.geometry.boundingSphere.radius;

};
window.__scene = scene;
window.__px = (cssX, cssY) => new Promise((resolve) => {
  window.__after = () => {
    const gl = renderer.getContext();
    const canvas = renderer.domElement;
    const dpr = renderer.getPixelRatio();
    const x = Math.max(0, Math.min(canvas.width - 1, Math.floor(cssX * dpr)));
    const y = Math.max(0, Math.min(canvas.height - 1, Math.floor(canvas.height - cssY * dpr)));
    const buf = new Uint8Array(4);
    gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    window.__after = null;
    resolve([buf[0], buf[1], buf[2], buf[3]]);
  };
});
window.__big = () => {
  const out = [];
  scene.updateMatrixWorld(true);
  scene.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry;
    if (!g.boundingBox) g.computeBoundingBox();
    const s = new THREE.Vector3();
    g.boundingBox.getSize(s);
    s.multiply(o.scale);
    const size = Math.max(s.x, s.y, s.z);
    if (size <= 50) return;
    const c = g.boundingBox.getCenter(new THREE.Vector3()).applyMatrix4(o.matrixWorld);
    out.push({
      name: o.name || g.type,
      size: +size.toFixed(1),
      sx: +s.x.toFixed(1), sy: +s.y.toFixed(1), sz: +s.z.toFixed(1),
      cx: +c.x.toFixed(1), cy: +c.y.toFixed(1), cz: +c.z.toFixed(1),
      mat: o.material.type,
      color: o.material.color ? "#" + o.material.color.getHexString() : "",
    });
  });
  return out;
};
window.__hit = (nx, ny) => {
  raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
  raycaster.far = 2000;
  return raycaster.intersectObjects(scene.children, true).slice(0, 4).map((h) => ({
    d: +h.distance.toFixed(1),
    name: h.object.name || h.object.geometry.type,
    color: h.object.material?.color ? "#" + h.object.material.color.getHexString() : h.object.material?.type,
    y: +h.point.y.toFixed(2),
  }));
};
